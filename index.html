<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3차 수요조사 공지사항 — 한민고등학교 교육과정</title>
<meta name="description" content="2차 수요조사 결과 조정해야할 부분이 많아 3차 조사 일정을 미룹니다. 세부 일정은 추후 공지합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002147; --mint:#7ad7c6; --surface:#f7f8fb;
    --text:#1b1f24; --muted:#5b6570; --line:#dfe3ea;
    /* 슬라이드와 같은 어두운 무대 — 밝은 판이 그 위에 얹혀 위아래로 띠가 남는다. */
    --stage:#1a1b1e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; background:var(--stage); color:var(--text);
    font-family:Inter,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .stage{
    position:relative; overflow:hidden; background:var(--surface);
    margin:44px 0; min-height:calc(100vh - 88px);
    display:flex; align-items:center; justify-content:center;
  }
  @media (max-width:640px){ .stage{ margin:20px 0; min-height:calc(100vh - 40px); } }
  /* 커버 슬라이드의 배경 장식 */
  .stage::before,.stage::after{
    content:""; position:absolute; border-radius:50%; filter:blur(80px); pointer-events:none;
  }
  .stage::before{top:-12%;left:-12%;width:40vw;height:40vw;background:var(--navy);opacity:.05}
  .stage::after{bottom:-12%;right:-12%;width:46vw;height:46vw;background:var(--mint);opacity:.10}
  main{position:relative;z-index:1;max-width:680px;padding:64px 24px;text-align:center}
  .overline{
    display:block;font-size:12px;font-weight:600;letter-spacing:.3em;
    text-transform:uppercase;color:#9bb0a8;margin-bottom:20px;
  }
  h1{
    font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:-.03em;
    line-height:1.2;color:var(--navy);margin:0 0 24px;text-wrap:balance;
  }
  .lead{font-size:17px;line-height:1.8;color:var(--text);margin:0 auto;max-width:34em}
  .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:44px}
  .btn{
    display:inline-flex;align-items:center;gap:10px;padding:15px 34px;border-radius:8px;
    font-size:16px;font-weight:800;text-decoration:none;
    box-shadow:0 6px 18px rgba(0,33,71,.10);transition:opacity .15s,background .15s;
  }
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{opacity:.9}
  .btn-mint{background:var(--mint);color:var(--navy)}
  .btn-mint:hover{background:#fff}
  .foot{margin-top:20px;font-size:12.5px;color:var(--muted)}
  .sig{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  @media (prefers-color-scheme:dark){
    :root{--surface:#0f1419;--text:#e8eaed;--muted:#9aa4b0;--line:#2a3138;--stage:#000}
    h1{color:#cfe9e2}
    .stage::before{background:#cfe9e2;opacity:.04}
    .btn-primary{background:#1b3a5c}
    .btn-mint{color:#0f1419}
    .btn-mint:hover{background:#a9e6da}
  }
</style>
</head>
<body>
<div class="stage">
<main>
  <span class="overline">HM Curriculum Design · Notice</span>
  <h1>3차 수요조사 공지사항</h1>
  <p class="lead">
    2차 수요조사 결과 조정해야할 부분이 많아 일정을 미룹니다.<br>
    세부 일정은 추후 공지하겠습니다.
  </p>
  <div class="actions">
    <a class="btn btn-primary" href="./slides.html">교육과정 안내 <span aria-hidden="true">→</span></a>
    <a class="btn btn-mint" href="./app/">내 선택 과목 확인</a>
  </div>
  <p class="foot">확인은 한민고 Google 계정(@hanmin.hs.kr)으로 로그인한 뒤 볼 수 있습니다 · 지금은 조사 기간이 아니라 제출은 되지 않습니다</p>
  <p class="sig">한민고등학교 미래교육과정부</p>
</main>
</div>
</body>
</html>
