<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제출 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --navy:#002147; --navy-deep:#000a1e; --navy-soft:#d6e3ff; --navy-mid:#2d476f; --navy-dim:#708ab5; --mint:#7ad7c6; --mint-soft:#97f3e2; --mint-deep:#005047; --mint-ink:#00201b;
    --surface:#faf9fd; --surface-low:#f4f3f7; --surface-mid:#efedf1; --surface-high:#e9e7eb; --line:#c4c6cf; --ink:#1a1b1e; --ink-2:#44474e; --outline:#74777f; --error:#ba1a1a; --error-soft:#ffdad6; --error-ink:#93000a; --shadow:0 10px 35px rgba(0,33,71,.08); }
  * { box-sizing: border-box; }
  html { font-size: 15px; }
  body { margin: 0; font-family: Inter, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", Pretendard, sans-serif; background: var(--surface); color: var(--ink); -webkit-font-smoothing: antialiased; }
  header.top { position: sticky; top: 0; z-index: 40; background: var(--navy); color: #fff; box-shadow: var(--shadow); }
  header.top .in { max-width: 1080px; margin: 0 auto; height: 64px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header.top .brand { display: flex; align-items: baseline; gap: 8px; font-weight: 700; letter-spacing: -.01em; }
  header.top .brand small { font-size: 12px; color: var(--mint); font-weight: 500; }
  header.top .meta { font-size: 12.5px; color: rgba(255,255,255,.72); display: none; }
  header.top .back { color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; padding: 6px 12px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; white-space: nowrap; }
  header.top .back:hover { background: rgba(255,255,255,.12); }
  @media (min-width: 720px) { header.top .meta { display: block; } }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 72px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; color: var(--navy); }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 20px; }
  .card { background: #fff; border: 1px solid rgba(196,198,207,.45); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input, select, button { font: inherit; font-size: 14px; color: var(--ink); }
  input[type=text], input[type=search], input[type=password], select { height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--navy); outline-offset: 1px; border-color: var(--navy); }
  button { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 600; transition: background .15s, color .15s; }
  button:hover { background: var(--surface-low); }
  button.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  button.primary:hover { background: var(--navy-deep); }
  button:disabled { opacity: .5; cursor: default; }
  button.mini { height: 28px; padding: 0 10px; font-size: 12px; margin-left: 6px; border-color: var(--navy); color: var(--navy); background: #fff; }
  button.mini:hover { background: var(--navy); color: #fff; }
  .note { font-size: 13px; color: var(--ink-2); }
  .err { color: var(--error); font-size: 13px; margin: 8px 0 0; }
  .muted { color: var(--outline); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--surface-mid); text-align: left; vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; width: 72px; }
  .tbl { overflow-x: auto; }
  .tbl table { table-layout: fixed; min-width: 520px; }
  .tbl td { overflow-wrap: anywhere; }
  th.w-cls, td.w-cls { width: 110px; white-space: nowrap; }
  th.w-name, td.w-name { width: 120px; }
  td.bar-cell { padding-right: 16px; }
  .bar { height: 8px; background: var(--surface-high); border-radius: 999px; overflow: hidden; min-width: 100px; }
  .bar > i { display: block; height: 100%; background: var(--navy); border-radius: 999px; }
  tr.cls { cursor: pointer; }
  tr.cls:hover td { background: var(--surface-low); }
  .chip { display: inline-block; margin: 0 6px 4px 0; padding: 2px 10px; border-radius: 999px; background: var(--error-soft); color: var(--error-ink); font-size: 13px; font-weight: 500; }
  .chip.ok { background: var(--mint-soft); color: var(--mint-deep); }
  .grade-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 12px; gap: 10px; flex-wrap: wrap; }
  .grade-title h2 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; margin: 0; color: var(--navy); }
  h3 { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--navy-dim); margin: 22px 0 8px; }
  .card h3:first-child { margin-top: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
  .tabs button { height: 36px; padding: 0 16px; border-radius: 999px; font-size: 13.5px; border-color: transparent; background: var(--surface-low); color: var(--ink-2); }
  .tabs button:hover { background: var(--surface-high); }
  .tabs button.on { background: var(--navy); color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { border-radius: 12px; padding: 16px 18px; background: var(--surface-low); }
  .kpi:first-child { background: var(--navy); color: #fff; }
  .kpi b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 4px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12.5px; color: var(--ink-2); }
  .kpi:first-child span { color: var(--mint); }
  .hidden { display: none !important; }
  .spinner { width: 36px; height: 36px; margin: 0 auto; border-radius: 50%; border: 4px solid var(--surface-high); border-top-color: var(--navy); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sticky { position: sticky; top: 64px; z-index: 5; }
  .student-hit { cursor: pointer; }
  .student-hit:hover td { background: var(--surface-low); }
  .login-wrap { max-width: 520px; margin: 40px auto 0; }
  .login-wrap .tag { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--outline); font-size: 12px; margin: 18px 0 14px; white-space: nowrap; }
  .gsi { display: flex; justify-content: center; min-height: 44px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--surface-high); }
  @media (max-width: 640px) { html { font-size: 14px; } th, td { padding: 7px 5px; font-size: 13px; } .bar { min-width: 60px; } .card { padding: 16px; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><span id="brand-school">교육과정 설계</span><small>제출 현황</small></div>
  <div class="row" style="gap:14px"><span class="meta" id="head-meta"></span><a class="back" href="../app/">← 선택 앱으로</a></div>
</div></header>
<main>
  <section class="card login-wrap" id="login">
    <div class="tag">Teacher Mode</div>
    <h1 id="title">제출 현황</h1>
    <p class="sub" id="subtitle">선택 과목 수요조사 — 반별 제출, 미제출자, 학생별 선택 과목, 과목별 인원을 한 화면에서 봅니다.</p>
    <div id="google-login" class="hidden">
      <div id="gsi-button" class="gsi"></div>
      <p class="note" style="margin:10px 0 0;text-align:center">교직원 명단에 등록된 학교 구글 계정으로 로그인합니다.</p>
      <div class="divider">또는 관리자 코드로</div>
    </div>
    <div class="row" style="flex-wrap:nowrap">
      <input type="password" id="admin-code" placeholder="관리자 코드" style="flex:1;min-width:0" autocomplete="off">
      <button id="admin-login" class="primary">코드로 보기</button>
    </div>
    <p class="note" style="margin:10px 0 0">관리자 코드는 담당 교사가 데스크톱 앱의 «제출 현황»에서 확인해 알려 줍니다.</p>
    <p class="err" id="login-error"></p>
  </section>

  <section class="card hidden" id="loading" style="text-align:center;padding:48px 20px">
    <div class="spinner" aria-hidden="true"></div>
    <p style="margin:16px 0 4px;font-weight:700;color:var(--navy)" id="loading-msg">제출 현황을 읽는 중입니다…</p>
    <p class="note" style="margin:0">학생 수백 명 분 자료라 10초 안팎 걸립니다.</p>
  </section>

  <div class="hidden" id="dash">
    <section class="card sticky" id="controls">
      <div class="row">
        <label class="row" style="gap:8px">차수 <select id="round"></select></label>
        <button id="refresh">새로 고침</button>
        <span class="note" id="schedule"></span>
        <span style="flex:1"></span>
        <a href="../app/" class="note" style="text-decoration:none;color:var(--navy);font-weight:600">선택 앱으로 돌아가기</a>
        <button id="logout">로그아웃</button>
      </div>
      <p class="err" id="error"></p>
      <nav class="tabs" id="tabs">
        <button data-tab="summary" class="on">요약</button>
        <button data-tab="submit">제출 현황</button>
        <button data-tab="students">학생별 선택</button>
        <button data-tab="stats">과목·계열 통계</button>
      </nav>
    </section>
    <div id="view-summary"></div>
    <div id="view-submit" class="hidden"></div>
    <div id="view-students" class="hidden"></div>
    <div id="view-stats" class="hidden"></div>
  </div>
</main>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let config = {};
  try { config = await (await fetch('./config.json', { cache: 'no-cache' })).json(); } catch { config = {}; }
  const SUBMIT_URL = String(config.submitUrl || '');
  const FINAL_ROUND = Math.max(1, Math.min(3, Number(config.finalRound) || 1));
  if (config.schoolName) { $('title').textContent = config.schoolName + ' 제출 현황'; document.title = config.schoolName + ' 제출 현황'; $('brand-school').textContent = config.schoolName; }
  if (!SUBMIT_URL) $('login-error').textContent = '응답 저장 주소가 설정되지 않은 사이트입니다. 데스크톱 앱에서 사이트를 다시 만들어 올리세요.';

  const auth = { token: '', sessionToken: '' };
  try { const saved = JSON.parse(sessionStorage.getItem('teacher_status_auth') || 'null'); if (saved && (saved.token || saved.sessionToken)) Object.assign(auth, saved); } catch { /* 무시 */ }
  const state = { report: null, counts: {}, round: null, choices: {}, groupIds: [] };

  function authBody(extra) { const b = Object.assign({}, extra); if (auth.token) b.token = auth.token; else b.sessionToken = auth.sessionToken; return b; }
  async function postJson(body) {
    const res = await fetch(SUBMIT_URL, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!data || !data.ok) throw new Error((data && (data.err || data.msg)) || '요청을 처리하지 못했습니다.');
    return data;
  }
  function groupLabel(id) { const m = /^g(\d)-s(\d)-(.+)$/.exec(String(id)); return m ? m[3] + ' (' + m[1] + '-' + m[2] + ')' : String(id); }
  function groupKey(id) { const m = /^g(\d)-s(\d)-(.+)$/.exec(String(id)); return m ? m[1] + '-' + m[2] + '-' + m[3] : 'z-' + id; }
  function fmt(iso) { if (!iso) return '미정'; const d = new Date(iso); return isNaN(d) ? String(iso) : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function seatSort(a, b) { return (a.class_no || 0) - (b.class_no || 0) || (a.number || 0) - (b.number || 0); }
  function byGradeOf(students) { const m = {}; students.forEach((s) => { const g = s.grade == null ? '?' : String(s.grade); (m[g] = m[g] || []).push(s); }); return m; }
  function byClassOf(list) { const m = {}; list.forEach((s) => { const c = s.class_no == null ? '반 미상' : s.class_no + '반'; (m[c] = m[c] || []).push(s); }); return Object.keys(m).sort((a, b) => (parseInt(a) || 999) - (parseInt(b) || 999)).map((c) => [c, m[c].sort(seatSort)]); }

  function showDash() {
    $('login').classList.add('hidden');
    const sel = $('round');
    if (!sel.options.length) {
      const auto = document.createElement('option'); auto.value = ''; auto.textContent = '접수 중인 차수'; sel.appendChild(auto);
      for (let r = 1; r <= FINAL_ROUND; r += 1) { const o = document.createElement('option'); o.value = String(r); o.textContent = r + '차'; sel.appendChild(o); }
    }
  }
  function showTab(name) {
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
    ['summary', 'submit', 'students', 'stats'].forEach((t) => $('view-' + t).classList.toggle('hidden', t !== name));
  }

  function countsFromRows(rows, targetGrade) {
    const byGroup = {}; let respondents = 0;
    rows.forEach((row) => {
      if (Number(row.target_grade) !== targetGrade) return;
      respondents += 1;
      Object.entries(row.subjects_by_group || {}).forEach(([gid, arr]) => {
        (Array.isArray(arr) ? arr : []).forEach((name) => { byGroup[gid] = byGroup[gid] || {}; byGroup[gid][name] = (byGroup[gid][name] || 0) + 1; });
      });
    });
    return { respondents, byGroup };
  }
  function absorbRows(rows) {
    state.choices = {}; const gids = new Set();
    (rows || []).forEach((row) => { state.choices[String(row.student_id)] = row; Object.keys(row.subjects_by_group || {}).forEach((g) => gids.add(g)); });
    state.groupIds = Array.from(gids).sort((a, b) => groupKey(a).localeCompare(groupKey(b), 'ko'));
    state.counts = {}; [2, 3].forEach((g) => { const c = countsFromRows(rows || [], g); if (c.respondents) state.counts[g] = c; });
  }
  function showLoading(msg) {
    $('loading').classList.remove('hidden'); $('loading-msg').textContent = msg;
    if (!state.report) $('dash').classList.add('hidden');
  }
  function hideLoading() { $('loading').classList.add('hidden'); $('dash').classList.remove('hidden'); }

  async function load(round) {
    $('error').textContent = ''; $('refresh').disabled = true;
    showLoading(round ? round + '차 자료를 읽는 중입니다…' : '제출 현황을 읽는 중입니다…');
    try {
      let report;
      try {
        report = await postJson(authBody({ action: 'dashboard', ...(round ? { round } : {}) }));
      } catch (e) {
        // 옛 스크립트(dashboard 통로 없음)면 종전처럼 셋으로 나눠 읽는다.
        if (!/처리하지 못|알 수 없|unknown/i.test(String(e && e.message))) throw e;
        report = await postJson(authBody({ action: 'status', ...(round ? { round } : {}) }));
        const ex = await postJson(authBody({ action: 'export', round: report.round })).catch(() => ({ rows: [] }));
        report.rows = ex.rows || [];
      }
      state.report = report; state.round = report.round;
      $('round').value = String(report.round);
      const sc = report.schedule && report.schedule['round' + report.round];
      $('head-meta').textContent = report.round + '차 · ' + report.submitted + '/' + report.total + '명 제출';
      $('schedule').textContent = (report.finalized ? '마감됨 · ' : (report.currentRound === report.round ? '접수 중 · ' : '')) + (sc ? fmt(sc.start) + ' ~ ' + fmt(sc.end) : '기간 미정') + ' · ' + report.submitted + '/' + report.total + '명 제출 · ' + new Date(report.generatedAt).toLocaleTimeString('ko-KR') + ' 기준';
      absorbRows(report.rows);
      renderAll();
      hideLoading();
    } catch (e) {
      $('loading').classList.add('hidden');
      if (state.report) $('dash').classList.remove('hidden');
      $('error').textContent = e && e.message ? e.message : String(e);
      if (/로그인|코드|교직원/.test($('error').textContent)) { sessionStorage.removeItem('teacher_status_auth'); }
    } finally { $('refresh').disabled = false; }
  }

  function renderAll() { renderSummary(); renderSubmit(); renderStudents(); renderStats(); }

  function renderSummary() {
    const r = state.report; const grades = byGradeOf(r.students);
    const kpis = ['<div class="kpi"><span>전체</span><b>' + r.submitted + ' / ' + r.total + '</b><span>' + pct(r.submitted, r.total) + '% 제출</span></div>']
      .concat(Object.keys(grades).sort().map((g) => { const l = grades[g]; const s = l.filter((x) => x.submitted).length; return '<div class="kpi"><span>' + esc(g) + '학년</span><b>' + s + ' / ' + l.length + '</b><span>' + pct(s, l.length) + '% 제출 · 미제출 ' + (l.length - s) + '명</span></div>'; }));
    const worst = [];
    Object.keys(grades).forEach((g) => byClassOf(grades[g]).forEach(([c, cl]) => { const s = cl.filter((x) => x.submitted).length; worst.push({ g, c, rate: pct(s, cl.length), missing: cl.length - s }); }));
    worst.sort((a, b) => b.rate - a.rate || a.missing - b.missing || String(a.g + a.c).localeCompare(String(b.g + b.c), 'ko'));
    const low = worst;
    $('view-summary').innerHTML = '<section class="card"><div class="kpis">' + kpis.join('') + '</div>'
      + (low.length ? '<h3>반별 제출률 (높은 순)</h3><div class="tbl"><table><thead><tr><th class="w-cls">반</th><th>제출</th><th class="num">제출률</th><th class="num">미제출</th></tr></thead><tbody>' + low.map((w) => '<tr class="cls" data-go-class="' + esc(w.g) + '|' + esc(w.c) + '"><td class="w-cls">' + esc(w.g) + '학년 ' + esc(w.c) + '</td><td class="bar-cell"><div class="bar"><i style="width:' + w.rate + '%"></i></div></td><td class="num">' + w.rate + '%</td><td class="num">' + w.missing + '</td></tr>').join('') + '</tbody></table></div>' : '')
      + '</section>';
    $('view-summary').querySelectorAll('tr[data-go-class]').forEach((tr) => tr.addEventListener('click', () => { showTab('submit'); const [g, c] = tr.dataset.goClass.split('|'); const el = document.getElementById('c-' + g + '-' + c); if (el) { el.classList.remove('hidden'); el.scrollIntoView({ block: 'center' }); } }));
  }

  function renderClasses() {
    const grades = byGradeOf(state.report.students); const out = [];
    Object.keys(grades).sort().forEach((g) => {
      const list = grades[g]; const s = list.filter((x) => x.submitted).length; let rows = '';
      byClassOf(list).forEach(([c, cl]) => {
        const done = cl.filter((x) => x.submitted).length; const missing = cl.filter((x) => !x.submitted); const p = pct(done, cl.length); const key = 'c-' + g + '-' + c;
        rows += '<tr class="cls" data-toggle="' + key + '"><td class="w-cls">' + esc(c) + '</td><td class="num">' + cl.length + '</td><td class="num">' + done + '</td><td class="num">' + missing.length + '</td><td class="bar-cell"><div class="bar"><i style="width:' + p + '%"></i></div></td><td class="num">' + p + '%</td></tr>';
        rows += '<tr class="hidden" id="' + key + '"><td colspan="6">' + (missing.length ? '미제출: ' + missing.map((x) => '<span class="chip">' + (x.number || '') + ' ' + esc(x.name) + '</span>').join('') : '<span class="chip ok">전원 제출</span>') + ' <button class="mini" data-go-students="' + esc(g) + '|' + esc(c) + '">이 반 선택 과목 보기</button></td></tr>';
      });
      out.push('<section class="card"><div class="grade-title"><h2>' + esc(g) + '학년</h2><span class="note">' + s + ' / ' + list.length + '명 제출 · 반을 누르면 미제출 학생이 보입니다</span></div><div class="tbl"><table><thead><tr><th class="w-cls">반</th><th class="num">대상</th><th class="num">제출</th><th class="num">미제출</th><th>비율</th><th class="num"></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>');
    });
    return out.join('') || '<section class="card"><span class="note">명단에 학생이 없습니다.</span></section>';
  }

  function missingLines(g) {
    return (byGradeOf(state.report.students)[g] || []).filter((s) => !s.submitted).sort(seatSort).map((s) => [g, s.class_no ?? '', s.number ?? '', s.name, s.student_id]);
  }
  function renderMissing() {
    const grades = byGradeOf(state.report.students); const out = [];
    Object.keys(grades).sort().forEach((g) => {
      const lines = missingLines(g);
      const rows = lines.map((l) => '<tr><td class="w-cls">' + esc(l[1]) + '반</td><td class="num">' + esc(l[2]) + '</td><td class="w-name">' + esc(l[3]) + '</td><td class="muted">' + esc(l[4]) + '</td></tr>').join('');
      out.push('<section class="card"><div class="grade-title"><h2>' + esc(g) + '학년 미제출 ' + lines.length + '명</h2><span class="row"><button data-copy="' + esc(g) + '">목록 복사</button><button data-csv="' + esc(g) + '">CSV 내려받기</button></span></div>'
        + (lines.length ? '<div class="tbl"><table><thead><tr><th class="w-cls">반</th><th class="num">번호</th><th class="w-name">이름</th><th>학번</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="note">전원 제출했습니다.</p>') + '</section>');
    });
    return out.join('');
  }
  function renderSubmit() {
    const v = $('view-submit');
    v.innerHTML = '<h3 style="margin-top:0">반별 제출</h3>' + renderClasses() + '<h3>미제출자 명단</h3>' + renderMissing();
    v.querySelectorAll('tr.cls').forEach((tr) => tr.addEventListener('click', () => $(tr.dataset.toggle).classList.toggle('hidden')));
    v.querySelectorAll('button[data-go-students]').forEach((btn) => btn.addEventListener('click', (e) => { e.stopPropagation(); const [g, c] = btn.dataset.goStudents.split('|'); showTab('students'); $('cls-grade').value = g; fillClassSelect(); $('cls-class').value = c; renderClassTable(); }));
    v.querySelectorAll('button[data-copy]').forEach((btn) => btn.addEventListener('click', async () => {
      const text = missingLines(btn.dataset.copy).map((l) => l[0] + '학년 ' + l[1] + '반 ' + l[2] + '번 ' + l[3]).join('\n');
      try { await navigator.clipboard.writeText(text); btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = '목록 복사'; }, 1500); } catch { window.prompt('복사할 목록', text); }
    }));
    v.querySelectorAll('button[data-csv]').forEach((btn) => btn.addEventListener('click', () => {
      const g = btn.dataset.csv; csvDownload('미제출자_' + g + '학년_' + state.round + '차.csv', [['학년', '반', '번호', '이름', '학번']].concat(missingLines(g)));
    }));
  }

  function renderSubjects() {
    const out = [];
    [2, 3].forEach((tg) => {
      const c = state.counts[tg]; if (!c) return;
      const groups = Object.keys(c.byGroup).sort((a, b) => groupKey(a).localeCompare(groupKey(b), 'ko'));
      const body = groups.map((gid) => {
        const rows = Object.entries(c.byGroup[gid]).sort((a, b) => b[1] - a[1]);
        const max = rows.length ? rows[0][1] : 0;
        return '<h3>' + esc(groupLabel(gid)) + '</h3><div class="tbl"><table><thead><tr><th style="width:40%">과목</th><th class="num">인원</th><th></th></tr></thead><tbody>' + rows.map(([name, n]) => '<tr><td>' + esc(name) + '</td><td class="num">' + n + '</td><td class="bar-cell"><div class="bar"><i style="width:' + pct(n, max) + '%"></i></div></td></tr>').join('') + '</tbody></table></div>';
      }).join('');
      out.push('<section class="card"><div class="grade-title"><h2>' + tg + '학년 과목</h2><span class="note">응답 ' + c.respondents + '명 · ' + state.round + '차 · 한 학생이 여러 과목을 고르므로 합계는 응답 수보다 큽니다</span></div>' + (body || '<p class="note">아직 제출이 없습니다.</p>') + '</section>');
    });
    return out.join('') || '<section class="card"><span class="note">과목별 인원을 읽지 못했습니다.</span></section>';
  }

  function renderFamily() {
    const grades = byGradeOf(state.report.students); const out = [];
    Object.keys(grades).sort().forEach((g) => {
      const list = grades[g].filter((s) => s.submitted);
      const fams = {}; list.forEach((s) => { const f = s.track_family || '미정'; fams[f] = (fams[f] || 0) + 1; });
      const names = Object.keys(fams).sort((a, b) => fams[b] - fams[a]);
      if (!list.length) { out.push('<section class="card"><h2 style="font-size:16px;margin:0">' + esc(g) + '학년</h2><p class="note">아직 제출이 없습니다.</p></section>'); return; }
      const kpis = names.map((f) => '<div class="kpi"><span>' + esc(f) + '</span><b>' + fams[f] + '</b><span>' + pct(fams[f], list.length) + '%</span></div>').join('');
      const rows = byClassOf(grades[g]).map(([c, cl]) => { const sub = cl.filter((s) => s.submitted); const cnt = {}; sub.forEach((s) => { const f = s.track_family || '미정'; cnt[f] = (cnt[f] || 0) + 1; }); return '<tr><td class="w-cls">' + esc(c) + '</td>' + names.map((f) => '<td class="num">' + (cnt[f] || 0) + '</td>').join('') + '<td class="num muted">' + sub.length + '</td></tr>'; }).join('');
      out.push('<section class="card"><div class="grade-title"><h2>' + esc(g) + '학년 계열</h2><span class="note">제출한 ' + list.length + '명 기준 · 제출할 때 고른 진로의 계열</span></div><div class="kpis" style="margin-bottom:12px">' + kpis + '</div><div class="tbl"><table><thead><tr><th class="w-cls">반</th>' + names.map((f) => '<th class="num">' + esc(f) + '</th>').join('') + '<th class="num">제출</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>');
    });
    return out.join('');
  }
  function renderStats() { $('view-stats').innerHTML = '<h3 style="margin-top:0">과목별 인원</h3>' + renderSubjects() + '<h3>계열 분포</h3>' + renderFamily(); }

  function csvDownload(name, lines) {
    const csv = '\ufeff' + lines.map((l) => l.map((v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function groupsForGrade(g) { return state.groupIds.filter((gid) => { const m = /^g(\d)-/.exec(gid); return !m || Number(m[1]) === Number(g) + 1; }); }
  function fillClassSelect() {
    const g = $('cls-grade').value; const sel = $('cls-class'); const keep = sel.value; sel.innerHTML = '';
    const all = document.createElement('option'); all.value = ''; all.textContent = '전체'; sel.appendChild(all);
    byClassOf(byGradeOf(state.report.students)[g] || []).forEach(([c]) => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
    if (Array.from(sel.options).some((o) => o.value === keep)) sel.value = keep;
  }
  function renderStudents() {
    const v = $('view-students');
    if (!$('cls-grade')) {
      v.innerHTML = '<section class="card"><div class="row"><label>학년 <select id="cls-grade"></select></label><label>반 <select id="cls-class"></select></label><label>과목 <select id="cls-filter"><option value="">전체</option></select></label><span style="flex:1"></span><input type="search" id="student-q" placeholder="이름·학번 검색" style="width:170px"><button id="cls-csv">CSV 내려받기</button></div><div id="student-list" style="margin-top:10px"></div><div id="cls-table" style="margin-top:10px"></div><div id="student-detail" style="margin-top:10px"></div></section>';
      $('cls-grade').addEventListener('change', () => { fillClassSelect(); renderClassTable(); });
      $('cls-class').addEventListener('change', renderClassTable);
      $('cls-filter').addEventListener('change', renderClassTable);
      $('student-q').addEventListener('input', renderStudentList);
      $('cls-csv').addEventListener('click', () => { const t = classRows(); csvDownload('선택과목_' + $('cls-grade').value + '학년' + ($('cls-class').value || '전체') + '_' + state.round + '차.csv', [t.header].concat(t.rows.map((r) => r.cells))); });
    }
    const gsel = $('cls-grade'); const keep = gsel.value; gsel.innerHTML = '';
    Object.keys(byGradeOf(state.report.students)).sort().forEach((g) => { const o = document.createElement('option'); o.value = g; o.textContent = g + '학년'; gsel.appendChild(o); });
    if (Array.from(gsel.options).some((o) => o.value === keep)) gsel.value = keep;
    fillClassSelect(); renderClassTable(); renderStudentList();
  }
  function classRows() {
    const g = $('cls-grade').value; const c = $('cls-class').value; const filter = $('cls-filter').value;
    const gids = groupsForGrade(g);
    const gradeList = byGradeOf(state.report.students)[g] || [];
    const wholeGrade = c === '';
    const list = (wholeGrade ? gradeList.slice() : gradeList.filter((s) => (s.class_no == null ? '반 미상' : s.class_no + '반') === c)).sort(seatSort);
    const header = (wholeGrade ? ['반', '번호', '이름', '계열'] : ['번호', '이름', '계열']).concat(gids.map(groupLabel)).concat(['제출']);
    const rows = list.map((s) => {
      const ch = state.choices[String(s.student_id)];
      const picks = gids.map((gid) => ch ? ((ch.subjects_by_group || {})[gid] || []).join(', ') : '');
      const all = picks.join(',');
      if (filter && !all.split(',').map((x) => x.trim()).includes(filter)) return null;
      const head = wholeGrade ? [s.class_no == null ? '' : s.class_no + '반', s.number ?? ''] : [s.number ?? ''];
      return { s, ch, cells: head.concat([s.name, ch ? (ch.track_family || '') : '']).concat(picks).concat([s.submitted ? fmt(s.updated_at) : '미제출']) };
    }).filter(Boolean);
    return { header, rows, gids, list, wholeGrade };
  }
  function renderClassTable() {
    const box = $('cls-table'); $('student-detail').innerHTML = ''; if (!$('cls-grade').value) { box.innerHTML = ''; return; }
    const t = classRows();
    const byGid = {}; t.list.forEach((s) => { const ch = state.choices[String(s.student_id)]; if (!ch) return; Object.entries(ch.subjects_by_group || {}).forEach(([gid, arr]) => { byGid[gid] = byGid[gid] || {}; (arr || []).forEach((n) => { byGid[gid][n] = (byGid[gid][n] || 0) + 1; }); }); });
    const fsel = $('cls-filter'); const keep = fsel.value; fsel.innerHTML = '<option value="">전체 과목</option>';
    t.gids.filter((gid) => byGid[gid]).forEach((gid) => {
      const og = document.createElement('optgroup'); og.label = groupLabel(gid);
      Object.keys(byGid[gid]).sort((a, b) => a.localeCompare(b, 'ko')).forEach((n) => { const o = document.createElement('option'); o.value = n; o.textContent = n + ' (' + byGid[gid][n] + '명)'; og.appendChild(o); });
      fsel.appendChild(og);
    });
    if (Array.from(fsel.options).some((o) => o.value === keep)) fsel.value = keep;
    const submitted = t.list.filter((s) => s.submitted).length;
    box.innerHTML = '<p class="note" style="margin:0 0 6px">' + (t.wholeGrade ? $('cls-grade').value + '학년 전체 ' : '') + t.list.length + '명 중 ' + submitted + '명 제출' + (fsel.value ? ' · «' + esc(fsel.value) + '» 고른 학생 ' + t.rows.length + '명' : '') + ' · 학생을 누르면 차수별 상세가 보입니다</p>'
      + '<div class="tbl"><table style="min-width:' + ((t.wholeGrade ? 420 : 360) + t.gids.length * 150) + 'px"><thead><tr>' + t.header.map((h, i) => { const k = t.wholeGrade ? i - 1 : i; return '<th' + (k === -1 ? ' class="w-cls" style="width:60px"' : k === 0 ? ' class="num" style="width:52px"' : k === 1 ? ' class="w-name" style="width:90px"' : k === 2 ? ' style="width:84px"' : i === t.header.length - 1 ? ' style="width:100px"' : ' style="width:150px"') + '>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>'
      + (t.rows.length ? t.rows.map((r) => '<tr class="student-hit" data-id="' + esc(r.s.student_id) + '"' + (r.s.submitted ? '' : ' style="color:#b91c1c"') + '>' + r.cells.map((cell, i) => '<td' + ((t.wholeGrade ? i === 1 : i === 0) ? ' class="num"' : '') + '>' + esc(cell) + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + t.header.length + '" class="note">해당하는 학생이 없습니다.</td></tr>')
      + '</tbody></table></div>';
    box.querySelectorAll('tr.student-hit').forEach((tr) => tr.addEventListener('click', () => showStudent(tr.dataset.id)));
  }
  function renderStudentList() {
    const q = ($('student-q').value || '').trim().toLowerCase();
    const box = $('student-list');
    if (!q) { box.innerHTML = ''; return; }
    const hits = state.report.students.filter((s) => (s.name || '').toLowerCase().includes(q) || String(s.student_id || '').includes(q)).sort((a, b) => (a.grade || 0) - (b.grade || 0) || seatSort(a, b)).slice(0, 20);
    box.innerHTML = hits.length
      ? '<div class="tbl"><table><thead><tr><th style="width:150px">학년·반·번호</th><th class="w-name">이름</th><th>학번</th><th style="width:170px">제출</th></tr></thead><tbody>' + hits.map((s) => '<tr class="student-hit" data-id="' + esc(s.student_id) + '"><td>' + (s.grade ?? '?') + '학년 ' + (s.class_no ?? '?') + '반 ' + (s.number ?? '?') + '번</td><td>' + esc(s.name) + '</td><td class="muted">' + esc(s.student_id) + '</td><td>' + (s.submitted ? '<span class="chip ok">제출 ' + fmt(s.updated_at) + '</span>' : '<span class="chip">미제출</span>') + '</td></tr>').join('') + '</tbody></table></div>'
      : '<p class="note">찾는 학생이 없습니다.</p>';
    box.querySelectorAll('tr.student-hit').forEach((tr) => tr.addEventListener('click', () => showStudent(tr.dataset.id)));
  }
  async function showStudent(id) {
    const box = $('student-detail'); box.innerHTML = '<p class="note">불러오는 중…</p>';
    try {
      const d = await postJson(authBody({ action: 'studentDetail', studentId: id }));
      const head = '<h3>' + esc(d.name) + ' · ' + (d.grade ?? '?') + '학년 ' + (d.class_no ?? '?') + '반 ' + (d.number ?? '?') + '번 <span class="muted">' + esc(d.student_id) + (d.email ? ' · ' + esc(d.email) : '') + '</span></h3>';
      if (!d.rounds.length) { box.innerHTML = head + '<p class="note">제출 기록이 없습니다.</p>'; return; }
      box.innerHTML = head + d.rounds.slice().reverse().map((r) => {
        const gids = Object.keys(r.subjects_by_group || {}).sort((a, b) => groupKey(a).localeCompare(groupKey(b), 'ko'));
        const rows = gids.map((gid) => '<tr><td>' + esc(groupLabel(gid)) + '</td><td>' + esc((r.subjects_by_group[gid] || []).join(', ')) + '</td></tr>').join('');
        const credits = Object.entries(r.credits || {}).sort().map(([k, v]) => k + '학기 ' + v).join(' · ');
        return '<div class="card" style="margin-top:8px"><div class="grade-title"><b>' + r.round + '차</b><span class="note">' + fmt(r.updated_at) + (r.track_family ? ' · ' + esc(r.track_family) + ' 계열' : '') + (r.track_major ? ' · ' + esc(r.track_major) : '') + '</span></div>'
          + (rows ? '<table><thead><tr><th style="width:180px">선택군</th><th>고른 과목</th></tr></thead><tbody>' + rows + '</tbody></table>' : '<p class="note">고른 과목이 없습니다.</p>')
          + (r.locked_by_track && r.locked_by_track.length ? '<p class="note" style="margin:8px 0 0">자동 배정: ' + esc(r.locked_by_track.join(', ')) + '</p>' : '')
          + (credits ? '<p class="note" style="margin:4px 0 0">학점: ' + esc(credits) + '</p>' : '') + '</div>';
      }).join('');
    } catch (e) { box.innerHTML = '<p class="err">' + esc(e && e.message ? e.message : e) + '</p>'; }
  }

  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) showTab(b.dataset.tab); });
  $('admin-login').addEventListener('click', async () => {
    const code = $('admin-code').value.trim();
    if (!code) { $('login-error').textContent = '관리자 코드를 넣으세요.'; return; }
    auth.token = code; auth.sessionToken = '';
    sessionStorage.setItem('teacher_status_auth', JSON.stringify(auth));
    showDash(); await load();
    if ($('error').textContent) { $('dash').classList.add('hidden'); $('login').classList.remove('hidden'); $('login-error').textContent = $('error').textContent; auth.token = ''; }
  });
  $('refresh').addEventListener('click', () => load(Number($('round').value) || undefined));
  $('round').addEventListener('change', () => load(Number($('round').value) || undefined));
  $('logout').addEventListener('click', () => { sessionStorage.removeItem('teacher_status_auth'); location.reload(); });

  if (config.loginMode === 'google' && config.googleClientId) {
    $('google-login').classList.remove('hidden');
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => {
      try {
        window.google.accounts.id.initialize({ client_id: config.googleClientId, callback: async (resp) => {
          try {
            const data = await postJson({ action: 'googleLogin', credential: resp.credential });
            if (!data.auth || data.auth.role !== 'teacher') throw new Error('교직원 명단(_teachers)에 등록된 계정만 볼 수 있습니다.');
            auth.sessionToken = data.auth.sessionToken; auth.token = '';
            sessionStorage.setItem('teacher_status_auth', JSON.stringify(auth));
            showDash(); await load();
          } catch (e) { $('login-error').textContent = e && e.message ? e.message : String(e); }
        } });
        window.google.accounts.id.renderButton($('gsi-button'), { theme: 'outline', size: 'large', text: 'signin_with', width: 320 });
      } catch { $('login-error').textContent = 'Google 로그인 버튼을 준비하지 못했습니다. 관리자 코드로 보세요.'; }
    };
    document.head.appendChild(s);
  }
  if (auth.token || auth.sessionToken) { showDash(); await load(); }
})();
</script>
</body>
</html>
